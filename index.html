<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F4EDE2;overflow:hidden;height:100vh;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:#C8B89A;border-radius:3px;}
input,select,button,textarea{font-family:'Plus Jakarta Sans',sans-serif;}
button{cursor:pointer;}button:hover{opacity:.82;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#D4753A!important;box-shadow:0 0 0 3px rgba(184,92,44,.12)!important;}
.serif{font-family:'Playfair Display',serif;}
.num{font-variant-numeric:tabular-nums;}

/* ===== pd2 (property detail v2) ===== */
.pd2{--canvas:#F2F1EC;--card:#FFFFFF;--ink:#17231A;--ink2:#3B473D;--mut:#727C6F;--line:#E7E4DB;
 --brand:#18271C;--clay:#B85C2C;
 --inc:#2F7D53;--exp:#B23B3B;--fin:#2B4C8C;--dep:#7A5AAE;--gold:#8A6A1E;}
.pd2 .muted{color:var(--mut)}
.pd2 .head{background:linear-gradient(150deg,#18271C,#233A25 70%,#2C4A2E);border-radius:20px;padding:26px 28px;color:#EAF1E6;position:relative;overflow:hidden;box-shadow:0 18px 40px -22px rgba(24,39,28,.55)}
.pd2 .head:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(184,92,44,.22),transparent 70%)}
.pd2 .head .eye{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9DBBA0;font-weight:600}
.pd2 .head h1{font-size:34px;line-height:1.05;margin:8px 0 4px;font-weight:700}
.pd2 .head .addr{color:#AEC6B0;font-size:13.5px}
.pd2 .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pd2 .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:5px 11px;border-radius:99px;font-size:12px;color:#DCE7D8}
.pd2 .chip b{color:#fff;font-weight:600}
.pd2 .chip.st{background:var(--clay);border-color:transparent;color:#fff;font-weight:600}
.pd2 .flag{position:absolute;right:26px;top:24px;text-align:right}
.pd2 .flag .fg{font-size:26px}
.pd2 .flag .u{font-size:12px;color:#AEC6B0;margin-top:2px}
.pd2 .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.pd2 .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;position:relative}
.pd2 .kpi .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700}
.pd2 .kpi .v{font-size:24px;font-weight:800;margin-top:7px;letter-spacing:-.01em}
.pd2 .kpi .s{font-size:11.5px;color:var(--mut);margin-top:3px}
.pd2 .kpi .dot{position:absolute;top:17px;right:16px;width:8px;height:8px;border-radius:50%}
.pd2 section{margin-top:26px}
.pd2 .sh{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.pd2 .sh .no{font-family:'Playfair Display',serif;font-size:13px;color:var(--clay);font-weight:700;width:26px}
.pd2 .sh h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.pd2 .sh .hint{margin-left:auto;font-size:12px;color:var(--mut)}
.pd2 .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.pd2 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pd2 .cf-top{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px}
.pd2 .stat{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:#FCFCFA}
.pd2 .stat .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.pd2 .stat .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pd2 .stat .v{font-size:20px;font-weight:800;margin-top:6px}
.pd2 .legend{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--mut);margin:2px 0 10px}
.pd2 .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.pd2 .legend .ln{width:16px;height:2px;border-radius:2px;background:var(--ink);display:inline-block;margin-right:5px;vertical-align:3px}
.pd2 .bar:hover{opacity:.78;cursor:default}
.pd2 .cft th{text-align:right;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line)}
.pd2 .cft th:first-child{text-align:left}
.pd2 .cft td{padding:9px 10px;border-bottom:1px solid #F1EFE8}
.pd2 .cft td:first-child{text-align:left;font-weight:600}
.pd2 .cft td:not(:first-child){text-align:right}
.pd2 .cft .fch{color:var(--mut);font-size:12px}
.pd2 .cft .pos{color:var(--inc);font-weight:700}
.pd2 .cft .neg{color:var(--exp);font-weight:700}
.pd2 .cft .pend{color:var(--gold);font-weight:700;font-size:11.5px}
.pd2 .cft .once{color:var(--dep);font-weight:700}
.pd2 .cft tr.tot td{border-top:2px solid var(--line);border-bottom:none;font-weight:800;font-size:14px;padding-top:11px}
.pd2 .cft tr.tot td:first-child{color:var(--ink)}
.pd2 .dotc{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:0}
.pd2 .tl{position:relative;padding:6px 0 2px}
.pd2 .tl .track{height:8px;background:#EFEDE6;border-radius:99px;position:relative;margin:26px 0 8px}
.pd2 .seg{position:absolute;height:8px;border-radius:99px;top:0}
.pd2 .tcard{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:#FCFCFA;margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pd2 .tcard .nm{font-weight:700}
.pd2 .tcard .dts{color:var(--mut);font-size:12px}
.pd2 .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.pd2 .tag.live{background:#E6F1EA;color:var(--inc)}
.pd2 .tag.past{background:#EFEDE6;color:var(--mut)}
.pd2 .kpend{margin-left:auto;text-align:right;color:var(--exp);font-weight:700;font-size:12px;line-height:1.25}
.pd2 .kpend small{display:block;color:var(--exp);opacity:.8;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.pd2 .kv{display:grid;grid-template-columns:1fr auto;gap:0}
.pd2 .kv>div{padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.pd2 .kv .lab{color:var(--mut)}
.pd2 .kv .val{text-align:right;font-weight:600}
.pd2 table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.pd2 table.t th{text-align:right;padding:9px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line)}
.pd2 table.t th:first-child{text-align:left}
.pd2 table.t td{padding:9px 10px;border-bottom:1px solid #F1EFE8}
.pd2 table.t td:not(:first-child){text-align:right}
.pd2 table.t tr:last-child td{border-bottom:none}
.pd2 .loan{border:1px solid var(--line);border-radius:13px;padding:14px;background:#FCFCFA}
.pd2 .loan .top{display:flex;justify-content:space-between;align-items:baseline}
.pd2 .loan .bk{font-weight:700;font-size:15px}
.pd2 .loan .sal{font-weight:800;font-size:18px}
.pd2 .loan .mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-size:12px}
.pd2 .loan .mini .l{color:var(--mut)}
.pd2 .loan .mini .r{text-align:right;font-weight:600}
.pd2 .pv{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.pd2 .pv:last-child{border-bottom:none}
.pd2 .pv .t{font-weight:700}
.pd2 .pv .d{color:var(--mut);font-size:12px}
.pd2 .pv .amt{font-weight:700}
.pd2 .sb{display:flex;align-items:center;gap:12px;margin:7px 0;font-size:13px}
.pd2 .sb .lab{width:230px;color:var(--ink2)}
.pd2 .sb .yr{font-size:10px;color:var(--mut);font-weight:600}
.pd2 .sb .track{flex:1;height:9px;background:#EFEDE6;border-radius:99px;overflow:hidden}
.pd2 .sb .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#C77A46,#B85C2C)}
.pd2 .sb .val{width:90px;text-align:right;font-weight:700}
.pd2 .al{display:flex;gap:11px;padding:13px 15px;border-radius:13px;margin-bottom:9px;font-size:13px;line-height:1.45}
.pd2 .al .ic{font-weight:800;font-size:13px;flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff}
.pd2 .al.r{background:#F7E9E7;border:1px solid #EAD2CE}
.pd2 .al.r .ic{background:var(--exp)}
.pd2 .al.y{background:#FBF4E4;border:1px solid #ECE0C4}

.pd2 .al b{display:block;margin-bottom:2px}
.pd2 .grid2{grid-template-columns:1fr}

// Load pisos from Supabase and transform to app format
async function loadPisosFromDB(){
  try{
    const[propsRes,tenantsRes,empadRes,histRes]=await Promise.all([
      supabase.from('re_properties').select('*').order('piso_id'),
      supabase.from('re_tenants').select('*').eq('activo',true),
      supabase.from('re_empadronados').select('*'),
      supabase.from('re_tenant_history').select('*'),
    ]);
    if(propsRes.error)throw propsRes.error;
    return propsRes.data.map(p=>{
      const tenant=tenantsRes.data?.find(t=>t.property_id===p.id)||{};
      const empad=empadRes.data?.filter(e=>e.property_id===p.id).map(e=>e.nombre)||[];
      const hist=histRes.data?.filter(h=>h.property_id===p.id).map(h=>({n:h.nombre,doc:h.documento,inicio:h.inicio,salida:h.salida,nota:h.nota}))||[];
      return{
        id:p.piso_id, proyecto:p.proyecto, tipo:p.tipo, renta:+p.renta,
        finca:p.finca, catastral:p.catastral, sup:p.sup, ibi:+p.ibi,
        precio:p.precio?+p.precio:null, pendiente:p.pendiente?+p.pendiente:null,
        venc:p.venc_taurus, opcion:p.opcion?+p.opcion:null, vencOp:p.venc_opcion,
        taurus:p.taurus_mensual?+p.taurus_mensual:null,
        alertas:p.alertas||[],
        empadronados:empad, historial:hist,
        dbId:p.id, // keep DB id for updates
        inq:{
          n:tenant.nombre||'—', doc:tenant.documento||'—',
          tel:tenant.telefono||'—', email:tenant.email||'—',
          inicio:tenant.inicio||'—', ultimoInc:tenant.ultimo_inc||'—',
          fianza:tenant.fianza?+tenant.fianza:null,
          ibe:tenant.ibe||'—', hid:tenant.hid||'—',
          nota:tenant.nota||'', tenantId:tenant.id
        }
      };
    });
  }catch(e){
    console.error('DB load failed, using fallback:',e);
    return null;
  }
}

// Save piso changes back to DB
async function savePisoToDB(piso){
  if(!piso.dbId)return;
  await supabase.from('re_properties').update({
    tipo:piso.tipo, renta:piso.renta, finca:piso.finca, catastral:piso.catastral,
    sup:piso.sup, ibi:piso.ibi, precio:piso.precio, pendiente:piso.pendiente,
    venc_taurus:piso.venc, opcion:piso.opcion, venc_opcion:piso.vencOp,
    taurus_mensual:piso.taurus, alertas:piso.alertas, proyecto:piso.proyecto,
    updated_at:new Date().toISOString()
  }).eq('id',piso.dbId);
  if(piso.inq?.tenantId){
    await supabase.from('re_tenants').update({
      nombre:piso.inq.n, documento:piso.inq.doc, telefono:piso.inq.tel,
      email:piso.inq.email, inicio:piso.inq.inicio, ultimo_inc:piso.inq.ultimoInc,
      fianza:piso.inq.fianza, ibe:piso.inq.ibe, hid:piso.inq.hid, nota:piso.inq.nota
    }).eq('id',piso.inq.tenantId);
  }
}

// Widget: Finance summary from Lupa DB
function WidgetLupa(){
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  useEffect(()=>{
    const now=new Date();
    const mesKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    supabase.from("transactions")
      .select("amount,type,category_id")
      .gte("date",mesKey+"-01")
      .lte("date",mesKey+"-31")
      .eq("type","expense")
      .then(({data:txns,error})=>{
        setLoading(false);
        if(error||!txns||txns.length===0){setData(null);return;}
        const total=txns.reduce((s,t)=>s+Math.abs(+t.amount),0);
        // top 3 categories by amount
        const byCat={};
        txns.forEach(t=>{const k=t.category_id||"otros";byCat[k]=(byCat[k]||0)+Math.abs(+t.amount);});
        const top3=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
        setData({total,top3,count:txns.length});
      });
  },[]);
  const CAT_ICONS={"alimentacion":"🛒","bebe":"👶","restaurantes":"🍽️","movilidad":"🚗","salud":"💊","ropa":"👕","ocio":"🎮","viajes":"✈️","tecnologia":"📱","limpieza":"🧺","deporte":"🏋️","otros":"📦"};
  return h(Card,null,
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
      h("div",{style:{fontSize:13,fontWeight:700,color:T.txt}},"💳 Lupa — Gastos este mes"),
      h("a",{href:"https://lupa-five.vercel.app",target:"_blank",
        style:{fontSize:12,color:T.acc,textDecoration:"none",fontWeight:600}},"Ver en Lupa →")
    ),
    loading?h("div",{style:{fontSize:13,color:T.mut,padding:"12px 0"}},"Cargando..."):
    !data?h("div",{style:{padding:"16px 0",textAlign:"center"}},
      h("div",{style:{fontSize:13,color:T.mut,marginBottom:8}},"Sin datos de Lupa todavía"),
      h("a",{href:"https://lupa-five.vercel.app",target:"_blank",
        style:{fontSize:12,color:T.acc,fontWeight:600,textDecoration:"none"}},"Conecta Lupa para ver tus finanzas")
    ):
    h("div",null,
      h("div",{className:"num",style:{fontSize:22,fontWeight:800,color:T.err,marginBottom:12}},e$(data.total)),
      h("div",{style:{fontSize:11,fontWeight:700,color:T.mut,textTransform:"uppercase",letterSpacing:.6,marginBottom:8}},"Top categorías"),
      data.top3.map(([cat,total],i)=>h("div",{key:i,style:{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${T.brd}`,fontSize:13}},
        h("span",null,(CAT_ICONS[cat]||"📦")+" "+cat),
        h("span",{className:"num",style:{fontWeight:600,color:T.err}},e$(total))
      ))
    )
  );
}

function PropertyDetailRich({property:p,onBack}){
  const[loans,setLoans]=useState([]);
  const[balances,setBalances]=useState([]);
  const[tenants,setTenants]=useState([]);
  const[weg,setWeg]=useState([]);
  const[nkDetail,setNkDetail]=useState([]);

  const[setup,setSetup]=useState([]);
  const[alerts,setAlerts]=useState([]);
  const[cashflow,setCashflow]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([
      supabase.from('re_portfolio_loans').select('*').eq('property_id',p.id),

    ]).then(async([l,t,w,nk,v,s,se,g,su,al,cf])=>{
      setLoans(l.data||[]);
      setTenants((t.data||[]).slice().sort((a,b)=>{const k=s=>{const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s||"");return m?+(m[3]+m[2]+m[1]):-1;};return k(b.start_date)-k(a.start_date);}));
      setWeg(w.data||[]);

      setGrundsteuer(g.data||[]);
      setSetup(su.data||[]);
      setAlerts(al.data||[]);

      setLoading(false);

  },[p.id]);

  if(loading)return h("div",{style:{padding:40,textAlign:'center',color:T.mut}},"Cargando...");

  const eur=(v,d=2)=>{if(v==null||isNaN(v))return "—";const n=v<0?"−":"";v=Math.abs(+v);return n+v.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d})+" €";};
  const eur0=v=>eur(v,0);
  const esc=s=>(s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const FLAG={DE:"🇩🇪",NL:"🇳🇱",ES:"🇪🇸",MX:"🇲🇽"};

  const totalRate=loans.reduce((s,l)=>s+(+l.rate_monthly||0),0);
  const saldoTot=loans.reduce((s,l)=>s+(+l.saldo||0),0);
  const tAct=tenants.find(t=>t.activo);
  const rentaActual=tAct?+tAct.renta:null;

  // ---- concept cashflow ----
  const now=new Date();
  const curMM=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const curY=String(now.getFullYear());
  const mesN=now.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
  const mesLabel=mesN.charAt(0).toUpperCase()+mesN.slice(1);
  const classify=(r)=>{
    const s=((r.payee||"")+" "+(r.categoria||"")).toLowerCase();
    if(r.flujo_tipo==='ingreso'){ if(s.includes('guth')||s.includes('abr.')||s.includes('erstatt'))return {c:"WEG Guthaben",dot:"#7A5AAE",once:true}; return {c:"Renta",dot:"#2F7D53"}; }

    if(s.includes('teilzahlung')||s.includes('darlehen')||s.includes('vr bank'))return {c:"Hipoteca · VR Bank",dot:"#B23B3B"};
    if(s.includes('hausgeld')||s.includes('felix')||s.includes('weg '))return {c:"Hausgeld (WEG)",dot:"#B23B3B"};
    if(s.includes('belkaw')||s.includes('strom'))return {c:"Strom",dot:"#B23B3B"};
    if(s.includes('netcologne')||s.includes('cologne')||s.includes('internet'))return {c:"Internet",dot:"#B23B3B"};
    if(s.includes('grundsteuer'))return {c:"Grundsteuer",dot:"#B23B3B"};
    if(s.includes('vermieterverein'))return {c:"Vermieterverein",dot:"#B23B3B"};
    if(r.flujo_tipo==='deposito')return {c:"Depósito",dot:"#7A6E61",skip:true};
    return {c:"Otros",dot:"#7A6E61"};
  };
  const opCF=cashflow.filter(r=>r.flujo_tipo==='ingreso'||r.flujo_tipo==='gasto');
  const cmap={};
  opCF.forEach(r=>{const cl=classify(r);if(cl.skip)return;const mm=(r.fecha||'').slice(0,7),yy=(r.fecha||'').slice(0,4);
    if(!cmap[cl.c])cmap[cl.c]={c:cl.c,dot:cl.dot,once:cl.once,mes:0,anio:0,fechaMes:null,hasMes:false};
    const o=cmap[cl.c]; if(yy===curY)o.anio+=(+r.importe_eur||0);
    if(mm===curMM){o.mes+=(+r.importe_eur||0);o.hasMes=true;if(!o.fechaMes||r.fecha>o.fechaMes)o.fechaMes=r.fecha;}});
  const orderC=["Renta","WEG Guthaben","Hipoteca · DZ Hyp","Hipoteca · VR Bank","Hausgeld (WEG)","Strom","Internet","Grundsteuer","Vermieterverein","Otros"];
  const concepts=Object.values(cmap).filter(o=>o.anio!==0||o.hasMes).sort((a,b)=>{const ia=orderC.indexOf(a.c),ib=orderC.indexOf(b.c);return (ia<0?99:ia)-(ib<0?99:ib);});
  const mesNeto=concepts.reduce((s,o)=>s+(o.hasMes?o.mes:0),0);
  const anioNeto=concepts.reduce((s,o)=>s+o.anio,0);
  const cfIng=opCF.filter(r=>r.flujo_tipo==='ingreso').reduce((s,r)=>s+(+r.importe_eur||0),0);
  const cfGas=opCF.filter(r=>r.flujo_tipo==='gasto').reduce((s,r)=>s+(+r.importe_eur||0),0);
  const cfDep=cashflow.filter(r=>r.flujo_tipo==='deposito').reduce((s,r)=>s+(+r.importe_eur||0),0);
  const fmtF=f=>{const m=/^\d{4}-(\d{2})-(\d{2})/.exec(f||"");return m?m[2]+"."+m[1]:"—";};
  // monthly buckets for chart
  const bm={};opCF.forEach(r=>{const m=(r.fecha||'').slice(0,7);if(!m)return;if(!bm[m])bm[m]={mm:m,ing:0,gas:0};bm[m][r.flujo_tipo==='ingreso'?'ing':'gas']+=(+r.importe_eur||0);});
  const CM=Object.values(bm).sort((a,b)=>a.mm<b.mm?-1:1);

  function cfChart(CMx){
    const arr=CMx.slice(-16); if(!arr.length)return "";
    const mx=Math.max(1,...arr.map(m=>Math.max(+m.ing||0,Math.abs(+m.gas||0))));
    const W=980,Hh=200,padT=14,padB=24,y0=padT+(Hh-padT-padB)/2,half=(Hh-padT-padB)/2;
    const n=arr.length,step=(W-24)/n,bw=Math.min(24,step-8);
    let bars="",labs="",pts=[];
    arr.forEach((m,i)=>{const ing=+m.ing||0,gas=Math.abs(+m.gas||0),cx=12+step*i+step/2;
      const ih=ing/mx*half,gh=gas/mx*half;
      bars+=`<rect class="bar" x="${(cx-bw/2).toFixed(1)}" y="${(y0-ih).toFixed(1)}" width="${bw}" height="${ih.toFixed(1)}" rx="3" fill="#2F7D53"></rect>`;
      bars+=`<rect class="bar" x="${(cx-bw/2).toFixed(1)}" y="${y0}" width="${bw}" height="${gh.toFixed(1)}" rx="3" fill="#D98A8A"></rect>`;
      const net=ing-gas,ny=y0-(net/mx*half);pts.push([cx,ny]);
      labs+=`<text x="${cx.toFixed(1)}" y="${Hh-7}" text-anchor="middle" font-size="9.5" fill="#9AA394">${m.mm.slice(5)}/${m.mm.slice(2,4)}</text>`;});
    const line=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
    const netp=`<path d="${line}" fill="none" stroke="#18271C" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/>`+pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.5" fill="#18271C"/>`).join("");
    return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="display:block"><line x1="8" y1="${y0}" x2="${W-8}" y2="${y0}" stroke="#E7E4DB"/>${bars}${netp}${labs}</svg>`;
  }

  const chip=(l,v)=>v?`<span class="chip"><b>${esc(l)}</b> ${esc(v)}</span>`:"";
  // timeline
  const parseD=s=>{const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s||"");return m?+(m[3]+m[2]+m[1]):(s&&/^\d{4}$/.test(s)?+(s+"0101"):0);};
  const tsort=tenants.slice();
  const all=tenants.map(t=>({...t,s:parseD(t.start_date),e:parseD(t.end_date)||+(curY+"0101")})).filter(t=>t.s);
  const minS=all.length?Math.min(...all.map(t=>t.s)):0,maxE=all.length?Math.max(...all.map(t=>t.e)):1;
  const toX=d=>((d-minS)/((maxE-minS)||1))*100;
  const tcol=["#6FBF95","#7FA8C0","#C99A6B","#8CA0B8","#B0A48F"];
  const segs=all.map((t,i)=>`<div class="seg" style="left:${toX(t.s).toFixed(1)}%;width:${Math.max(2,toX(t.e)-toX(t.s)).toFixed(1)}%;background:${tcol[i%tcol.length]};${t.activo?'box-shadow:0 0 0 2px #2F7D53':''}"></div>`).join("");

  const vlast=vorschuss.length?+vorschuss[vorschuss.length-1].mes:0;

  const K=(k,v,s,c)=>`<div class="kpi"><span class="dot" style="background:${c}"></span><div class="k">${esc(k)}</div><div class="v num">${v}</div><div class="s">${esc(s)}</div></div>`;

  const crow=o=>{
    const pend=!o.hasMes&&!o.once&&o.anio!==0;
    const mesCell=o.once?`<span class="muted" style="font-size:11.5px">puntual</span>`:(pend?`<span class="pend">pendiente</span>`:`<span class="num ${o.mes>=0?'pos':'neg'}">${o.hasMes?eur(o.mes):"—"}</span>`);
    const fch=pend?`<span class="pend">— falta cargo</span>`:`<span class="fch num">${o.hasMes?fmtF(o.fechaMes):"—"}</span>`;
    const ac=o.once?'once':(o.anio>=0?'pos':'neg');
    return `<tr><td><span class="dotc" style="background:${o.dot}"></span>${esc(o.c)}</td><td>${fch}</td><td>${mesCell}</td><td><span class="num ${ac}">${eur(o.anio)}</span></td></tr>`;
  };

  const app=`
   <div class="head">
     <div class="flag"><div class="fg">${FLAG[p.country]||""}</div><div class="u num">${esc(p.miteigentumsanteil||'')}</div></div>
     <div class="eye">Portafolio · Inmueble</div><h1 class="serif">${esc(p.name)}</h1>
     <div class="addr">${esc(p.address||"")}${p.unit?" · "+esc(p.unit):""}</div>
     <div class="chips">${p.status_label?`<span class="chip st">${esc(p.status_label)}</span>`:""}${chip("MEA",p.miteigentumsanteil)}${chip("Eigentümerin",p.owner)}${chip("Verwaltung",p.verwaltung)}</div>
   </div>
   <div class="kpis">
     ${K("Renta actual",rentaActual?eur0(rentaActual):"—",tAct?("Warmmiete · hasta "+(tAct.end_date||"")):"vacante","#2F7D53")}
     ${K("Resultado del mes",eur(mesNeto),mesLabel,"#18271C")}
     ${K("Saldo crédito",eur0(saldoTot),p.saldo_fecha?("Actualizado "+p.saldo_fecha):(loans.length+" Darlehen"),"#2B4C8C")}
     ${K("Cuota / mes",eur(totalRate),"Kapitaldienst","#B85C2C")}
   </div>
   ${cashflow.length?`<section>
     <div class="sh"><span class="no">01</span><h2>Cashflow real · Lupa</h2><span class="hint">en vivo · ${cashflow.length} mov.</span></div>
     <div class="card">
       <div class="cf-top">
         <div class="stat"><div class="k"><i style="background:#2F7D53"></i>Ingresos</div><div class="v num" style="color:#2F7D53">${eur0(cfIng)}</div></div>
         <div class="stat"><div class="k"><i style="background:#B23B3B"></i>Gastos</div><div class="v num" style="color:#B23B3B">${eur0(cfGas)}</div></div>
         <div class="stat"><div class="k"><i style="background:#18271C"></i>Neto operativo</div><div class="v num">${eur0(cfIng+cfGas)}</div></div>
         <div class="stat"><div class="k"><i style="background:#7A5AAE"></i>Depósitos</div><div class="v num" style="color:#7A5AAE">${eur0(cfDep)}</div></div>
       </div>
       <div class="legend"><span><i style="background:#2F7D53"></i>Ingresos</span><span><i style="background:#D98A8A"></i>Gastos</span><span><span class="ln"></span>Neto mensual</span></div>
       ${cfChart(CM)}
       <div class="tbx"><table class="cft"><thead><tr><th>Concepto</th><th>Fecha</th><th>${esc(mesLabel)}</th><th>Año ${curY}</th></tr></thead><tbody>
         ${concepts.map(crow).join("")}
         <tr class="tot"><td>Resultado</td><td></td><td><span class="num ${mesNeto>=0?'pos':'neg'}">${eur(mesNeto)}</span></td><td><span class="num ${anioNeto>=0?'pos':'neg'}">${eur(anioNeto)}</span></td></tr>
       </tbody></table></div>
       <div class="muted" style="font-size:11.5px;margin-top:8px">Mes en curso: los cargos que aún no debitan aparecen como “pendiente”.</div>
     </div>
   </section>`:""}
   ${loans.length?`<section>
     <div class="sh"><span class="no">02</span><h2>Financiación</h2><span class="hint">${p.saldo_fecha?("Saldo al "+p.saldo_fecha+" · "):""}${loans.map(l=>l.zins_pct+"%").join(" / ")}</span></div>
     <div class="grid2">${loans.map(l=>`<div class="loan"><div class="top"><span class="bk">${esc(l.bank)}</span><span class="sal num">${eur(l.saldo)}</span></div>
       <div class="mini">
         <span class="l">Ursprung</span><span class="r num">${eur0(l.ursprung)}</span>
         <span class="l">Zinssatz</span><span class="r num">${esc(l.zins_pct)} %</span>
         <span class="l">Rate/mes</span><span class="r num">${eur(l.rate_monthly)}</span>
         <span class="l">Zinsbindung</span><span class="r num">${esc(l.zinsbindung||"—")}</span>
         <span class="l">Kreditlaufzeit</span><span class="r num">${esc(l.laufzeit||"—")}</span>
         ${p.saldo_fecha?`<span class="l">Saldo al</span><span class="r num">${esc(p.saldo_fecha)}</span>`:""}
       </div></div>`).join("")}</div>
   </section>`:""}
   ${tenants.length?`<section>
     <div class="sh"><span class="no">03</span><h2>Inquilinos</h2><span class="hint">histórico completo</span></div>
     <div class="card"><div class="tl"><div class="track">${segs}</div></div>
       ${tsort.map(t=>{const pend=!t.activo&&+t.kaution>0;return `<div class="tcard"><span class="tag ${t.activo?'live':'past'}">${t.activo?'ACTUAL':'—'}</span><span class="nm">${esc(t.name)}</span><span class="dts num">${esc(t.start_date||"")} → ${esc(t.end_date||"?")}</span><span class="dts">${[t.tipo,t.renta?eur0(t.renta):null,t.personas?t.personas+" Pers.":null].filter(Boolean).map(esc).join(" · ")}</span>${pend?`<span class="kpend">${eur0(t.kaution)}<small>Pendiente devolución</small></span>`:(t.activo&&+t.kaution>0?`<span class="dts" style="margin-left:auto">Kaution ${eur0(t.kaution)}</span>`:"")}</div>`;}).join("")}
     </div>
   </section>`:""}
   ${(weg.length||grundsteuer.length)?`<section>
     <div class="sh"><span class="no">04</span><h2>WEG-Jahresabrechnung & Verwaltung</h2><span class="hint">${esc(p.verwaltung||"")}${vlast?" · Vorschuss "+eur0(vlast)+"/mes":""}</span></div>
     <div class="card">
       ${weg.length?`<div class="tbx"><table class="t"><thead><tr><th>Jahr</th><th>umlagef.</th><th>nicht uml.</th><th>Rücklage</th><th>Vorschuss</th><th>Ergebnis</th></tr></thead><tbody>
       ${weg.map(r=>`<tr><td class="num">${r.jahr}</td><td class="num">${eur(r.umlagef)}</td><td class="num">${eur(r.nicht_uml)}</td><td class="num">${eur(r.ruecklage)}</td><td class="num">${eur(r.vorschuss)}</td><td class="num" style="font-weight:700;color:${r.ergebnis>=0?'#2F7D53':'#B23B3B'}">${eur(r.ergebnis)} <span class="muted" style="font-size:10px">${esc(r.tipo||"")}</span></td></tr>`).join("")}
       </tbody></table></div>`:""}
       ${grundsteuer.length?`<table class="t" style="margin-top:14px"><thead><tr><th>Grundsteuer B</th><th>Betrag</th></tr></thead><tbody>${grundsteuer.map(g=>`<tr><td class="num">${g.jahr}</td><td class="num">${eur(g.betrag)}</td></tr>`).join("")}</tbody></table>`:""}
     </div>
   </section>`:""}
   ${(strom||stromEntries.length)?`<section>
     <div class="sh"><span class="no">05</span><h2>Proveedores</h2><span class="hint">contratos del depa</span></div>
     <div class="card">
       ${strom?`<div class="pv"><div><span class="t">Strom</span> · ${esc(strom.proveedor||"")}<div class="d">${[strom.kundennr&&("Kundennr. "+strom.kundennr),strom.titular&&("Titular: "+strom.titular)].filter(Boolean).map(esc).join(" · ")}</div></div><div class="amt d">laufend</div></div>`:""}
       ${stromEntries.map(e=>`<div class="pv"><div><span class="t">${esc(e.periodo)}</span></div><div class="d">${esc(e.detalle)}</div></div>`).join("")}
     </div>
   </section>`:""}
   ${setup.length?`<section>
     <div class="sh"><span class="no">06</span><h2>Adecuación & inversión</h2><span class="hint">Reforma + Mobiliario</span></div>
     <div class="card">
       ${(()=>{const mx=Math.max(...setup.map(s=>+s.betrag||0),1);return setup.slice().sort((a,b)=>b.betrag-a.betrag).map(s=>`<div class="sb"><span class="lab">${esc(s.item)}</span><span class="track"><span class="fill" style="width:${(+s.betrag/mx*100).toFixed(1)}%"></span></span><span class="val num">${eur0(s.betrag)}</span></div>`).join("");})()}
       <div class="sb" style="border-top:1px solid var(--line);margin-top:8px;padding-top:9px"><span class="lab" style="font-weight:700">Total inversión</span><span class="track" style="visibility:hidden"></span><span class="val num" style="font-weight:800">${eur0(setup.reduce((s,r)=>s+(+r.betrag||0),0))}</span></div>
     </div>
   </section>`:""}
   <section>
     <div class="sh"><span class="no">07</span><h2>Datos de compra</h2></div>
     <div class="card"><div class="kv"><div class="lab">Adquisición</div><div class="val">${esc(p.kauf_kaufvertrag||"—")}</div><div class="lab">Besitzübergang</div><div class="val">${esc(p.kauf_besitzuebergang||"—")}</div><div class="lab">Veräußerer</div><div class="val">${esc(p.kauf_verkaeufer||"—")}</div><div class="lab">Kaufpreis / Finanz.</div><div class="val num">${eur0(p.kaufpreis)}</div><div class="lab">Inversión total</div><div class="val num">${eur0(p.inversion_total)}</div></div></div>
   </section>
   ${alerts.length?`<section>
     <div class="sh"><span class="no">08</span><h2>Alertas & pendientes</h2></div>
     <div>${alerts.map(a=>`<div class="al ${a.nivel==='r'?'r':'y'}"><span class="ic">${a.nivel==='r'?'!':'i'}</span><div><b>${esc(a.titulo)}</b>${esc(a.detalle)}</div></div>`).join("")}</div>
   </section>`:""}
  `;

  return h("div",null,
    h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:16}},
      h("button",{onClick:onBack,style:{border:"none",background:T.card,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:13,color:T.acc,fontWeight:600,border:`1px solid ${T.brd}`}},"← Portafolio")
    ),
    h("div",{className:"pd2",dangerouslySetInnerHTML:{__html:app}})
  );
}


function PaymentTrackingDashboard(){
  const[charges,setCharges]=useState([]);
  const[loading,setLoading]=useState(true);
  const[refreshing,setRefreshing]=useState(false);

  const load=()=>{
    const now=new Date();
    const start=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-01";
    supabase.from("re_portfolio_rent_charges")
      .select("*, re_portfolio(name,country), re_portfolio_tenants(name)")
      .eq("period",start)
      .then(({data})=>{setCharges(data||[]);setLoading(false);});
  };
  useEffect(load,[]);

  const refresh=async()=>{
    setRefreshing(true);
    await supabase.rpc("generate_monthly_rent_charges");
    await supabase.rpc("match_rent_charges");
    load();
    setRefreshing(false);
  };

  const STATUS={
    paid_on_time:{label:"Pagado a tiempo",color:T.ok,bg:"#E8F0DC",icon:"✓"},
    paid_late:{label:"Pagado tarde",color:T.wrn,bg:"#FBF6EC",icon:"⏱"},
    unpaid:{label:"NO PAGADO — FLAG JP",color:T.err,bg:"#FBEDEA",icon:"🔴"},
    pending:{label:"Pendiente",color:T.mut,bg:T.bg,icon:"○"},
  };

  const now=new Date();
  const mesLabel=now.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
  const unpaidCount=charges.filter(c=>c.status==="unpaid").length;

  if(loading)return h(Card,{style:{padding:20,marginBottom:16}},
    h("div",{style:{color:T.mut,fontSize:13}},"Cargando seguimiento de pagos..."));

  return h(Card,{style:{marginBottom:20,border:unpaidCount>0?`2px solid ${T.err}`:`1px solid ${T.brd}`}},
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
      h("div",null,
        h("div",{style:{fontSize:14,fontWeight:800,color:T.txt}},"💰 Seguimiento de pagos — "+mesLabel),
        unpaidCount>0&&h("div",{style:{fontSize:12,color:T.err,fontWeight:700,marginTop:2}},
          "⚠ "+unpaidCount+" inquilino"+(unpaidCount>1?"s":"")+" sin pagar")
      ),
      h("button",{onClick:refresh,disabled:refreshing,
        style:{padding:"7px 14px",background:T.acc,color:"#fff",border:"none",borderRadius:8,
          fontSize:12,fontWeight:700,cursor:"pointer",opacity:refreshing?.6:1}},
        refreshing?"Actualizando...":"🔄 Actualizar pagos")
    ),
    charges.length===0
      ?h("div",{style:{fontSize:13,color:T.mut,padding:"10px 0"}},
          "No hay cargos para este mes. Clic en 'Actualizar pagos'.")
      :h("div",{style:{display:"flex",flexDirection:"column",gap:6}},
          charges.map((c,i)=>{
            const st=STATUS[c.status]||STATUS.pending;
            return h("div",{key:i,
              style:{display:"flex",justifyContent:"space-between",alignItems:"center",
                padding:"9px 12px",background:st.bg,borderRadius:8,
                border:c.status==="unpaid"?`1px solid #F0CFC8`:"none"}},
              h("div",{style:{display:"flex",alignItems:"center",gap:10}},
                h("span",{style:{fontSize:16}},st.icon),
                h("div",null,
                  h("div",{style:{fontSize:13,fontWeight:700,color:T.txt}},
                    (c.re_portfolio?.name||"—")+" · "+(c.re_portfolio_tenants?.name||"—")),
                  h("div",{style:{fontSize:11,color:st.color,fontWeight:600}},
                    st.label+(c.paid_date?" · "+c.paid_date:""))
                )
              ),
              h("div",{className:"num",style:{fontSize:14,fontWeight:800,color:T.txt}},
                Number(c.amount_expected).toLocaleString("de-DE",{minimumFractionDigits:2})+" €")
            );
          })
      )
  );
}

function KPIExpandable({kpi}){
  const[open,setOpen]=useState(false);
  return h("div",{
    onClick:()=>setOpen(!open),
    style:{background:T.card,border:`1px solid ${open?T.acc:T.brd}`,borderRadius:12,padding:14,
      cursor:"pointer",transition:"border-color .15s",position:"relative"}},
    h("div",{style:{fontSize:10,textTransform:"uppercase",letterSpacing:.7,color:T.mut,fontWeight:700,marginBottom:5}},kpi.k),
    h("div",{className:"num",style:{fontSize:17,fontWeight:800,
      color:kpi.res!==undefined?(kpi.res>=0?T.ok:T.err):kpi.neg?T.err:kpi.pos?T.ok:T.txt}},kpi.v),
    h("div",{style:{fontSize:10,color:T.acc,marginTop:4}},open?"▲ Cerrar":"▼ Desglose"),
    open&&h("div",{style:{marginTop:10,borderTop:`1px solid ${T.brd}`,paddingTop:8,
      display:"flex",flexDirection:"column",gap:3}},
      (kpi.detail||[]).map((d,i)=>h("div",{key:i,style:{fontSize:11,color:T.mut,fontFamily:"monospace"}},d))
    )
  );
}

function PortafolioModule(){
  const[props,setProps]=useState([]);
  const[loans,setLoans]=useState([]);
  const[tenants,setTenants]=useState([]);
  const[sel,setSel]=useState(null);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([
      supabase.from('re_portfolio').select('*').eq('active',true).order('country'),
      supabase.from('re_portfolio_loans').select('*'),
      supabase.from('re_portfolio_tenants').select('*'),
    ]).then(([p,l,t])=>{
      setProps(p.data||[]);
      setLoans(l.data||[]);
      setTenants(t.data||[]);
      setLoading(false);
    });
  },[]);

  const loansOf=pid=>loans.filter(l=>l.property_id===pid);
  const tenantsOf=pid=>tenants.filter(t=>t.property_id===pid);
  const totalRate=pid=>loansOf(pid).reduce((s,l)=>s+(+l.rate_monthly||0),0);
  const totalSaldo=pid=>loansOf(pid).reduce((s,l)=>s+(+l.saldo||0),0);
  const rentaActual=pid=>{
    const ts=tenantsOf(pid).filter(t=>t.activo);
    return ts.reduce((s,t)=>s+(+t.renta||0),0);
  };
  const resultado=pid=>{
    const r=rentaActual(pid);
    const c=totalRate(pid);
    if(!r||!c)return null;
    return r-c;
  };
  const e$=(v,cur='EUR')=>cur==='MXN'?`$ ${v?.toLocaleString('es-MX',{minimumFractionDigits:0})} MXN`:`${v?.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})} €`;
  const fmt$=(v,cur='EUR',pos=false)=>{
    if(v===null||v===undefined)return null;
    const s=e$(Math.abs(v),cur);
    return h("span",{style:{color:v>=0?T.ok:T.err,fontWeight:700}},(v>=0?'+ ':'− ')+s);
  };

  if(loading)return h("div",{style:{padding:40,textAlign:'center',color:T.mut}},"Cargando portafolio...");

  // DETAIL VIEW
  if(sel){
    const p=props.find(x=>x.id===sel);
    if(!p)return null;
    return h(PropertyDetailRich,{property:p,onBack:()=>setSel(null)});
  }

  // PORTFOLIO LIST VIEW
  const totalPortVal=props.filter(p=>p.kaufpreis&&p.kaufpreis_cur==='EUR').reduce((s,p)=>s+(+p.kaufpreis||0),0);

  return h("div",null,

    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}},
      [
        {k:"Portfolio value (EUR)",v:totalPortVal.toLocaleString("de-DE",{maximumFractionDigits:0})+" €",
         detail:props.filter(p=>p.kaufpreis&&p.kaufpreis_cur==="EUR").map(p=>p.name+": "+(+p.kaufpreis).toLocaleString("de-DE",{maximumFractionDigits:0})+" €")},
        {k:"Cuotas totales/mes",neg:true,v:totalRateAll.toLocaleString("de-DE",{minimumFractionDigits:2})+" €",
         detail:props.filter(p=>totalRate(p.id)>0).map(p=>p.name+": "+totalRate(p.id).toLocaleString("de-DE",{minimumFractionDigits:2})+" €")},
        {k:"Rentas EUR/mes",pos:true,v:totalRentaAll.toLocaleString("de-DE",{minimumFractionDigits:2})+" €",
         detail:props.filter(p=>rentaActual(p.id)>0).map(p=>p.name+": "+rentaActual(p.id).toLocaleString("de-DE",{minimumFractionDigits:2})+" €")},
        {k:"Resultado neto EUR",res:totalRentaAll-totalRateAll,v:(totalRentaAll-totalRateAll).toLocaleString("de-DE",{minimumFractionDigits:2})+" €",
         detail:props.filter(p=>resultado(p.id)!==null).map(p=>{const r=resultado(p.id);return p.name+": "+(r>=0?"+":"")+r.toLocaleString("de-DE",{minimumFractionDigits:2})+" €";})},
      ].map((k,i)=>h(KPIExpandable,{key:i,kpi:k}))
    ),
    // Country breakdown
    h("div",{style:{display:"flex",gap:8,marginBottom:16}},
      byCountry.map(({c,count})=>h("div",{key:c,style:{display:"flex",alignItems:"center",gap:5,padding:"4px 12px",borderRadius:99,background:COUNTRY_COLOR[c],color:COUNTRY_TXT[c],fontSize:12,fontWeight:700}},
        COUNTRY_FLAG[c]+" "+c+" · "+count))
    ),
    // Property cards
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}},
      props.map(p=>{
        const res=resultado(p.id);
        const ls=loansOf(p.id);
        const tAct=tenantsOf(p.id).filter(t=>t.activo);
        return h("div",{key:p.id,onClick:()=>setSel(p.id),
          style:{background:T.card,border:`1px solid ${T.brd}`,borderRadius:14,padding:16,cursor:"pointer",transition:"box-shadow .15s"},

          onMouseLeave:e=>e.currentTarget.style.boxShadow="none"},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}},
            h("div",null,
              h("div",{style:{fontWeight:800,fontSize:15,color:T.txt}},p.name),
              h("div",{style:{fontSize:12,color:T.mut,marginTop:2}},p.address)
            ),
            h("div",{style:{fontSize:10,padding:"2px 8px",borderRadius:99,background:COUNTRY_COLOR[p.country],color:COUNTRY_TXT[p.country],fontWeight:700,flexShrink:0}},COUNTRY_FLAG[p.country]+" "+p.country)
          ),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}},
            [
              {k:"Saldo",v:ls.length?e$(totalSaldo(p.id)):"—"},
              {k:"Cuota",v:ls.length?e$(totalRate(p.id)):"—"},
              {k:"Resultado",v:res!==null?null:"—",res},
            ].map((k,i)=>h("div",{key:i,style:{background:T.bg,borderRadius:8,padding:"8px 10px"}},
              h("div",{style:{fontSize:10,color:T.mut,fontWeight:600,textTransform:"uppercase",letterSpacing:.5,marginBottom:3}},k.k),
              k.res!==undefined&&k.res!==null?
                h("div",{className:"num",style:{fontSize:12,fontWeight:700,color:k.res>=0?T.ok:T.err}},(k.res>=0?"+ ":"− ")+e$(Math.abs(k.res))):
                h("div",{className:"num",style:{fontSize:12,fontWeight:700,color:T.txt}},k.v)
            ))
          ),
          tAct.length>0&&h("div",{style:{fontSize:12,color:T.mut}},
            "👤 "+tAct.map(t=>t.name.split(" ")[0]).join(", ")
          )
        );
      })
    )
  );
}

          h("path",{fill:"#FBBC05",d:"M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"}),
          h("path",{fill:"#34A853",d:"M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"})
        ),
        loading?"Conectando...":"Continuar con Google"
      ),
      // Divider
      h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:16}},
        h("div",{style:{flex:1,height:1,background:T.brd}}),
        h("span",{style:{fontSize:12,color:T.mut}},"o"),
        h("div",{style:{flex:1,height:1,background:T.brd}})
      ),
      // Email/password
      h("div",{style:{display:"flex",flexDirection:"column",gap:10,marginBottom:16}},
        h("input",{type:"email",value:email,onChange:e=>setEmail(e.target.value),placeholder:"Email",
          style:{padding:"11px 14px",border:`1.5px solid ${T.brd}`,borderRadius:10,fontSize:14,background:T.bg,color:T.txt,textAlign:"left"}}),
        h("input",{type:"password",value:pass,onChange:e=>setPass(e.target.value),placeholder:"Contraseña",
          onKeyDown:e=>e.key==="Enter"&&signInEmail(),
          style:{padding:"11px 14px",border:`1.5px solid ${T.brd}`,borderRadius:10,fontSize:14,background:T.bg,color:T.txt,textAlign:"left"}}),
        h("button",{onClick:signInEmail,disabled:loading||!email||!pass,
          style:{padding:"12px",background:T.acc,color:"#fff",border:"none",borderRadius:10,fontSize:15,fontWeight:600,cursor:"pointer",opacity:(email&&pass)?1:.5}},
          loading?"Entrando...":"Entrar")
      ),
      error&&h("div",{style:{marginTop:4,fontSize:13,color:T.err,padding:"8px 12px",background:T.eLt,borderRadius:8}},error),
      h("div",{style:{marginTop:20,fontSize:12,color:T.mut}},"Acceso restringido · Solo para la familia Fonseca")
    )
  );
}

// ─── ROOT APP ──────────────────────────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(undefined);
  const[mod,setMod]=useState("home");
  const[pisos,setPisos]=useState(PISOS_FALLBACK);
  const[pisosLoaded,setPisosLoaded]=useState(false);
  const[rePagos,setRePagos]=useState(()=>store.load("re_p",[]));
  const[reGastos,setReGastos]=useState(()=>store.load("re_g",[]));
  const[kClients,setKClients]=useState(()=>store.load("k_clients",K_CLIENTS_DEFAULT));
  const[kPos,setKPos]=useState(()=>store.load("k_pos",K_POSITIONS_DEFAULT));
  const[vw,setVw]=useState(typeof window!=="undefined"?window.innerWidth:1200);
  const[menuOpen,setMenuOpen]=useState(false);
  useEffect(()=>{const f=()=>setVw(window.innerWidth);window.addEventListener("resize",f);return()=>window.removeEventListener("resize",f);},[]);

  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session:s}})=>setSession(s));
    const{data:{subscription}}=supabase.auth.onAuthStateChange((_,s)=>{
      setSession(s);
      // Load pisos from DB when user logs in
      if(s&&!pisosLoaded){
        loadPisosFromDB().then(data=>{
          if(data){setPisos(data);setPisosLoaded(true);}
        });
      }
    });
    return()=>subscription.unsubscribe();
  },[]);

  // Also load pisos if session already exists
  useEffect(()=>{
    if(session&&!pisosLoaded){
      loadPisosFromDB().then(data=>{
        if(data){setPisos(data);setPisosLoaded(true);}
      });
    }
  },[session]);

  useEffect(()=>store.save("k_clients",kClients),[kClients]);
  useEffect(()=>store.save("k_pos",kPos),[kPos]);

  // Loading
  if(session===undefined)return h("div",{style:{height:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",gap:10,fontSize:14,color:T.mut}},"Cargando...");

  // Not logged in
  if(!session)return h(LoginScreen,null);

  // Logged in
  const alerts={re:pisos.reduce((s,p)=>s+(p.alertas||[]).filter(a=>a.includes("URGENTE")).length,0),opos:kPos.filter(o=>o.status==="rejected").length};
  const isMobile=vw<820;
  const setModC=(m)=>{setMod(m);setMenuOpen(false);};
  return h("div",{style:{display:"flex",height:"100vh",background:T.bg,overflow:"hidden"}},
    h(Sidebar,{mod,setMod:setModC,alerts,user:session.user,onSignOut:()=>supabase.auth.signOut(),isMobile,menuOpen}),
    isMobile&&menuOpen&&h("div",{onClick:()=>setMenuOpen(false),style:{position:"fixed",inset:0,background:"rgba(10,15,12,.5)",zIndex:190}}),
    isMobile&&h("button",{onClick:()=>setMenuOpen(o=>!o),style:{position:"fixed",top:12,left:12,zIndex:210,width:40,height:40,borderRadius:10,border:"none",background:T.side,color:"#fff",fontSize:18,cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,.25)"}},menuOpen?"✕":"☰"),
    h("main",{style:{flex:1,overflow:"auto",padding:isMobile?"58px 14px 24px":"22px 26px"}},
      mod==="home"&&h(HomeDashboard,{pisos,rePagos,setMod:setModC}),
      mod==="re"&&h(RealEstateModule,{pisos,setPisos,rePagos,setRePagos,reGastos,setReGastos}),
      mod==="portfolio"&&h(PortafolioModule,null),
      mod==="opos"&&h(KanzleiModule,{kClients,setKClients,kPos,setKPos})
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
